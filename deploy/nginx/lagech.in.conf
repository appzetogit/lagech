# Customer-facing site — lagech.in and www.lagech.in
#
# Same build as the admin host, different entry point: here `/` renders the
# landing page, because this is where customers arrive. admin.lagech.in
# redirects `/` to /admin instead; that is the only difference between them.
#
# TLS lines are written by hand rather than by certbot's installer: renewal runs
# through the DNS-01 authenticator with `certonly`, which does not touch nginx.
# The lineage is named for api.lagech.in because that was the first name on
# it; it covers all six.

server {
    listen 80;
    listen [::]:80;
    server_name lagech.in www.lagech.in;
    return 301 https://lagech.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lagech.in;

    ssl_certificate     /etc/letsencrypt/live/api.lagech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lagech.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One canonical hostname, so links, cookies and analytics do not split in two.
    return 301 https://lagech.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lagech.in;

    ssl_certificate     /etc/letsencrypt/live/api.lagech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lagech.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/lagech-cloudflare-guard*.conf;

    root /srv/lagech/admin;
    index index.html;

    access_log /var/log/nginx/lagech-www.access.log;
    error_log  /var/log/nginx/lagech-www.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploaded media is stored with RELATIVE urls ("/uploads/business/logos/x.webp"),
    # so a browser on this host resolves them against this host -- not against the
    # API. Without this they fall through to the SPA catch-all below and return
    # index.html with a 200, so images render broken while the network tab shows
    # no error at all.
    #
    # Served straight off disk rather than proxied: the files are local, and this
    # also matches dev, where Vite proxies /uploads to the backend so media stays
    # same-origin.
    location /uploads/ {
        alias /srv/lagech/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
